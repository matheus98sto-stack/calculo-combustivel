<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Combustível - Brasil </title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main class="card">
        <h1>Gasto de Combustível - Brasil</h1>
        <form id="form-combustivel">
            <div class="input-group">
                <label for="distancia">Distância da viagem (km)</label>
                <input type="number" id="distancia" placeholder="Ex: 150" required min="0.1" step="0.1">
            </div>
            
            <div class="input-group">
                <label for="consumo">Consumo do veículo (km/l)</label>
                <input type="number" id="consumo" placeholder="Ex: 12" required min="0.1" step="0.1">
            </div>

            <div class="input-group">
                <label for="preco">Preço do litro (R$)</label>
                <input type="number" id="preco" placeholder="Ex: 5.50" required min="0.1" step="0.01">
            </div>

            <button type="submit">Calcular Custo</button>
        </form>

        <div id="resultado-container" class="oculto">
            <h2>Custo Estimado:</h2>
            <p id="valor-resultado" class="destaque"></p>
        </div>
    </main>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
